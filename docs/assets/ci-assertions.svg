<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 310" width="820" height="310">
  <defs>
    <style>
      .window { fill: #0d1117; stroke: #30363d; stroke-width: 1px; rx: 8px; }
      .titlebar { fill: #161b22; }
      .title-text { fill: #8b949e; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 500; text-anchor: middle; }
      .code { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 12.5px; }
      .prompt { fill: #58a6ff; font-weight: 600; }
      .cmd { fill: #f0f6fc; font-weight: 500; }
      .dim { fill: #6e7681; }
      .text { fill: #c9d1d9; }
      .success { fill: #3fb950; font-weight: 600; }
      .warning { fill: #d29922; }
      .highlight { fill: #79c0ff; }
      .purple { fill: #d2a8ff; }
    </style>
  </defs>

  <rect class="window" x="1" y="1" width="818" height="308" />
  <path class="titlebar" d="M1,1 H819 Q819,1 819,8 V36 H1 V8 Q1,1 8,1 Z" />
  <circle cx="20" cy="18" r="6" fill="#ff5f56" />
  <circle cx="38" cy="18" r="6" fill="#ffbd2e" />
  <circle cx="56" cy="18" r="6" fill="#27c93f" />
  <text class="title-text" x="410.0" y="22">bash — automated ci idempotency barrier assertion</text>
  <g class="code" transform="translate(24, 58)">
    <text y="0"><tspan class="prompt">$ </tspan><tspan class="cmd">webhook-replay-proxy replay --file fixtures/order_paid.json \</tspan></text>
    <text y="20"><tspan class="cmd">    --concurrency 10 \</tspan></text>
    <text y="40"><tspan class="cmd">    --assert-status "200:1,409:9" \</tspan></text>
    <text y="60"><tspan class="cmd">    --max-latency 150ms</tspan></text>
    <text y="86"><tspan class="text">Replaying from fixture: fixtures/order_paid.json</tspan></text>
    <text y="104"><tspan class="dim">• Concurrency: 10 simultaneous requests via start barrier</tspan></text>
    <text y="128"><tspan class="text">[1]  HTTP </tspan><tspan class="success">200 OK</tspan><tspan class="dim">      | Latency: 14ms  (Processed &amp; lock acquired)</tspan></text>
    <text y="146"><tspan class="text">[2]  HTTP </tspan><tspan class="warning">409 Conflict</tspan><tspan class="dim">| Latency: 15ms  (Idempotency lock held)</tspan></text>
    <text y="164"><tspan class="text">[3]  HTTP </tspan><tspan class="warning">409 Conflict</tspan><tspan class="dim">| Latency: 15ms</tspan></text>
    <text y="182"><tspan class="text">[4..10] HTTP </tspan><tspan class="warning">409 Conflict</tspan><tspan class="dim">| Latency: 16ms  (Safely deduplicated)</tspan></text>
    <text y="210"><tspan class="success">✓ All Assertions Passed:</tspan> <tspan class="text">Status [200:1, 409:9], Max Latency 16ms &lt; 150ms</tspan></text>
    <text y="228"><tspan class="dim">Finished: 1/10 (9 conflicts safely handled) in 17ms total</tspan></text>
  </g>
</svg>
