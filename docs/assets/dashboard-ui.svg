<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" width="860" height="380">
  <defs>
    <style>
      .window { fill: #0d1117; stroke: #30363d; stroke-width: 1px; rx: 8px; }
      .header-bar { fill: #161b22; stroke-bottom: #30363d; }
      .title-text { fill: #58a6ff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 600; }
      .subtitle { fill: #8b949e; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; }
      .card { fill: #161b22; stroke: #30363d; stroke-width: 1px; rx: 6px; }
      .sidebar { fill: #11161d; stroke-right: #30363d; }
      .badge { fill: rgba(88, 166, 255, 0.15); stroke: rgba(88, 166, 255, 0.35); stroke-width: 1px; rx: 4px; }
      .badge-text { fill: #58a6ff; font-family: ui-monospace, monospace; font-size: 10px; font-weight: 600; }
      .code-font { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
      .ui-font { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; }
      .accent { fill: #58a6ff; }
      .green { fill: #3fb950; font-weight: 600; }
      .red { fill: #f85149; }
      .dim { fill: #6e7681; }
      .text { fill: #c9d1d9; }
      .white { fill: #f0f6fc; font-weight: 600; }
      .btn { fill: #1f6feb; rx: 4px; }
      .btn-text { fill: #ffffff; font-family: -apple-system, sans-serif; font-size: 11px; font-weight: 600; }
      .btn-sec { fill: #21262d; stroke: #30363d; stroke-width: 1px; rx: 4px; }
      .btn-sec-text { fill: #c9d1d9; font-family: -apple-system, sans-serif; font-size: 11px; }
    </style>
  </defs>

  <!-- Chrome -->
  <rect class="window" x="1" y="1" width="858" height="378" />
  <path class="header-bar" d="M1,1 H859 Q859,1 859,8 V40 H1 V8 Q1,1 8,1 Z" />
  <circle cx="20" cy="20" r="5" fill="#ff5f56" />
  <circle cx="36" cy="20" r="5" fill="#ffbd2e" />
  <circle cx="52" cy="20" r="5" fill="#27c93f" />

  <text class="title-text" x="78" y="24">⚡ Webhook Replay Proxy</text>
  <rect class="badge" x="245" y="13" width="90" height="18" />
  <text class="badge-text" x="255" y="26">LIVE DASHBOARD</text>
  <text class="subtitle" x="650" y="24">http://localhost:8080/_dashboard</text>

  <!-- Split Pane Layout -->
  <!-- Left Sidebar (Events list) -->
  <rect fill="#161b22" x="1" y="41" width="280" height="337" />
  <line x1="281" y1="41" x2="281" y2="378" stroke="#30363d" stroke-width="1" />

  <!-- Sidebar Header -->
  <text class="ui-font" fill="#8b949e" font-weight="600" x="16" y="64">CAPTURED WEBHOOKS</text>
  <rect class="btn-sec" x="210" y="52" width="56" height="20" />
  <text class="btn-sec-text" x="220" y="66">Refresh</text>
  <line x1="1" y1="78" x2="280" y2="78" stroke="#30363d" stroke-width="1" />

  <!-- Event 1 (Selected) -->
  <rect fill="rgba(88,166,255,0.12)" x="1" y="79" width="280" height="66" />
  <line x1="1" y1="79" x2="4" y2="145" stroke="#58a6ff" stroke-width="3" />
  <text class="ui-font white" x="16" y="98">POST <tspan fill="#8b949e">/webhook/stripe</tspan></text>
  <text class="green ui-font" x="235" y="98">200 OK</text>
  <text class="code-font dim" x="16" y="116">evt_1792882862</text>
  <text class="ui-font accent" font-size="10" x="16" y="134">STRIPE • 18ms</text>
  <text class="ui-font dim" font-size="10" x="215" y="134">16:04:12</text>
  <line x1="1" y1="145" x2="280" y2="145" stroke="#30363d" stroke-width="1" />

  <!-- Event 2 -->
  <text class="ui-font text" x="16" y="166">POST <tspan fill="#8b949e">/gh-webhook</tspan></text>
  <text class="green ui-font" x="235" y="166">200 OK</text>
  <text class="code-font dim" x="16" y="184">evt_1792882750</text>
  <text class="ui-font purple" fill="#d2a8ff" font-size="10" x="16" y="202">GITHUB • 24ms</text>
  <text class="ui-font dim" font-size="10" x="215" y="202">16:02:45</text>
  <line x1="1" y1="212" x2="280" y2="212" stroke="#30363d" stroke-width="1" />

  <!-- Event 3 -->
  <text class="ui-font text" x="16" y="233">POST <tspan fill="#8b949e">/slack/events</tspan></text>
  <text class="red ui-font" x="235" y="233">401 Auth</text>
  <text class="code-font dim" x="16" y="251">evt_1792882610</text>
  <text class="ui-font text" fill="#e3b341" font-size="10" x="16" y="269">SLACK • 8ms</text>
  <text class="ui-font dim" font-size="10" x="215" y="269">15:58:19</text>

  <!-- Right Detail Panel -->
  <g transform="translate(300, 52)">
    <!-- Event Meta Card -->
    <rect class="card" x="0" y="0" width="540" height="74" />
    <text class="ui-font white" x="14" y="22">Event: <tspan class="accent">evt_1792882862</tspan></text>
    <rect class="badge" x="460" y="10" width="65" height="18" />
    <text class="badge-text" x="474" y="23">STRIPE</text>
    <text class="code-font text" x="14" y="44">Forwarded: <tspan class="green">200 OK (18ms)</tspan>  |  Method: <tspan class="accent">POST</tspan>  |  Path: <tspan class="text">/webhook/stripe</tspan></text>
    <text class="code-font dim" x="14" y="62">Target: http://localhost:3000/webhooks</text>

    <!-- Interactive Replayer Card -->
    <rect class="card" x="0" y="86" width="540" height="110" />
    <text class="ui-font white" x="14" y="106">Interactive Replay &amp; Mutation</text>

    <!-- Inputs -->
    <rect fill="#0d1117" stroke="#30363d" rx="4" x="14" y="118" width="310" height="26" />
    <text class="code-font text" x="22" y="135">data.object.status=failed, data.object.amount=5000</text>

    <rect fill="#0d1117" stroke="#30363d" rx="4" x="334" y="118" width="190" height="26" />
    <text class="code-font dim" x="342" y="135">whsec_dev_local_secret</text>

    <!-- Buttons -->
    <rect class="btn" x="14" y="156" width="105" height="26" />
    <text class="btn-text" x="26" y="173">🚀 Replay Event</text>

    <rect class="btn-sec" x="128" y="156" width="95" height="26" />
    <text class="btn-sec-text" x="138" y="173">📋 Copy curl</text>

    <text class="ui-font green" x="238" y="173">✓ Dispatched! HTTP 200 (14ms) — Valid HMAC</text>

    <!-- Payload JSON Viewer -->
    <rect class="card" x="0" y="206" width="540" height="110" />
    <text class="ui-font white" x="14" y="226">Payload JSON Preview</text>
    <rect fill="#090d13" stroke="#21262d" rx="4" x="14" y="236" width="512" height="70" />
    <text class="code-font text" x="24" y="254">{</text>
    <text class="code-font text" x="38" y="270"><tspan fill="#79c0ff">"id"</tspan>: <tspan fill="#a5d6ff">"evt_1Mv..."</tspan>, <tspan fill="#79c0ff">"type"</tspan>: <tspan fill="#a5d6ff">"payment_intent.succeeded"</tspan>,</text>
    <text class="code-font text" x="38" y="286"><tspan fill="#79c0ff">"data"</tspan>: { <tspan fill="#79c0ff">"object"</tspan>: { <tspan fill="#79c0ff">"amount"</tspan>: <tspan fill="#ff7b72">2000</tspan> <tspan class="green">→ 5000</tspan>, <tspan fill="#79c0ff">"status"</tspan>: <tspan class="green">"failed"</tspan> } }</text>
    <text class="code-font text" x="24" y="300">}</text>
  </g>
</svg>
