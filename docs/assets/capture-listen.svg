<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 290" width="820" height="290">
  <defs>
    <style>
      .window { fill: #0d1117; stroke: #30363d; stroke-width: 1px; rx: 8px; }
      .titlebar { fill: #161b22; }
      .title-text { fill: #8b949e; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 500; text-anchor: middle; }
      .code { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 13px; }
      .prompt { fill: #58a6ff; font-weight: 600; }
      .cmd { fill: #f0f6fc; font-weight: 500; }
      .dim { fill: #6e7681; }
      .text { fill: #c9d1d9; }
      .success { fill: #3fb950; font-weight: 600; }
      .warning { fill: #d29922; }
      .highlight { fill: #79c0ff; }
      .purple { fill: #d2a8ff; }
      .diff-remove { fill: #ff7b72; }
      .diff-add { fill: #3fb950; }
    </style>
  </defs>

  <!-- Window chrome -->
  <rect class="window" x="1" y="1" width="818" height="288" />
  <path class="titlebar" d="M1,1 H819 Q819,1 819,8 V36 H1 V8 Q1,1 8,1 Z" />
  <circle cx="20" cy="18" r="6" fill="#ff5f56" />
  <circle cx="38" cy="18" r="6" fill="#ffbd2e" />
  <circle cx="56" cy="18" r="6" fill="#27c93f" />
  <text class="title-text" x="410.0" y="22">bash — webhook-replay-proxy listen</text>
  <g class="code" transform="translate(24, 62)">
    <text y="0"><tspan class="prompt">$ </tspan><tspan class="cmd">webhook-replay-proxy listen --port 8080 --forward-to http://localhost:3000/webhooks</tspan></text>
    <text y="22"><tspan class="purple">webhook-replay-proxy 0.1.0</tspan><tspan class="text"> starting</tspan></text>
    <text y="44"><tspan class="dim">• Listening on:</tspan> <tspan class="highlight">http://0.0.0.0:8080</tspan></text>
    <text y="66"><tspan class="dim">• Forwarding to:</tspan> <tspan class="highlight">http://localhost:3000/webhooks</tspan></text>
    <text y="88"><tspan class="dim">• Storage:</tspan> <tspan class="text">SQLite (./webhooks.db)</tspan></text>
    <text y="110"><tspan class="dim">────────────────────────────────────────────────────────────────────────────</tspan></text>
    <text y="132"><tspan class="success">[CAPTURED]</tspan> <tspan class="text">evt_179285514721 | Provider: </tspan><tspan class="purple">stripe  </tspan><tspan class="text"> | POST /webhooks/stripe | Forwarded: </tspan><tspan class="success">200</tspan><tspan class="dim"> (18ms)</tspan></text>
    <text y="154"><tspan class="success">[CAPTURED]</tspan> <tspan class="text">evt_179285519842 | Provider: </tspan><tspan class="highlight">github  </tspan><tspan class="text"> | POST /webhooks/github | Forwarded: </tspan><tspan class="success">200</tspan><tspan class="dim"> (12ms)</tspan></text>
    <text y="176"><tspan class="success">[CAPTURED]</tspan> <tspan class="text">evt_179285523419 | Provider: </tspan><tspan class="warning">slack   </tspan><tspan class="text"> | POST /webhooks/slack  | Forwarded: </tspan><tspan class="success">200</tspan><tspan class="dim"> (24ms)</tspan></text>
    <text y="198"><tspan class="success">[CAPTURED]</tspan> <tspan class="text">evt_179285528912 | Provider: </tspan><tspan class="success">shopify </tspan><tspan class="text"> | POST /webhooks/orders | Forwarded: </tspan><tspan class="success">200</tspan><tspan class="dim"> (15ms)</tspan></text>
  </g>
