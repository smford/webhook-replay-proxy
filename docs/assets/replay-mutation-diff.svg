<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 686" width="820" height="686">
  <defs>
    <style>
      .window { fill: #0d1117; stroke: #30363d; stroke-width: 1px; rx: 8px; }
      .titlebar { fill: #161b22; }
      .title-text { fill: #8b949e; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 500; text-anchor: middle; }
      .code { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 13px; }
      .prompt { fill: #58a6ff; font-weight: 600; }
      .cmd { fill: #f0f6fc; font-weight: 500; }
      .dim { fill: #6e7681; }
      .text { fill: #c9d1d9; }
      .success { fill: #3fb950; font-weight: 600; }
      .warning { fill: #d29922; }
      .highlight { fill: #79c0ff; }
      .purple { fill: #d2a8ff; }
      .diff-remove { fill: #ff7b72; }
      .diff-add { fill: #3fb950; }
    </style>
  </defs>

  <!-- Window chrome -->
  <rect class="window" x="1" y="1" width="818" height="684" />
  <path class="titlebar" d="M1,1 H819 Q819,1 819,8 V36 H1 V8 Q1,1 8,1 Z" />
  <circle cx="20" cy="18" r="6" fill="#ff5f56" />
  <circle cx="38" cy="18" r="6" fill="#ffbd2e" />
  <circle cx="56" cy="18" r="6" fill="#27c93f" />
  <text class="title-text" x="410.0" y="22">bash — webhook-replay-proxy replay with mutations</text>
  <g class="code" transform="translate(24, 62)">
    <text y="0"><tspan class="prompt">$ </tspan><tspan class="cmd">webhook-replay-proxy replay evt_179285514721 \</tspan></text>
    <text y="22"><tspan class="cmd">    --secret whsec_dev_local_secret \</tspan></text>
    <text y="44"><tspan class="cmd">    --set data.object.amount_total=999999 \</tspan></text>
    <text y="66"><tspan class="cmd">    --set data.object.payment_status=unpaid \</tspan></text>
    <text y="88"><tspan class="cmd">    --diff --concurrency 5</tspan></text>
    <text y="110"></text>
    <text y="132"><tspan class="purple">Replaying event:</tspan> <tspan class="text">evt_179285514721</tspan></text>
    <text y="154"><tspan class="dim">• Mutations (2):</tspan> <tspan class="text">data.object.amount_total=999999, data.object.payment_status=unpaid</tspan></text>
    <text y="176"><tspan class="dim">• Cryptography:</tspan> <tspan class="success">Re-signed with Stripe HMAC-SHA256 (fresh Unix timestamp)</tspan></text>
    <text y="198"><tspan class="dim">• Concurrency Barrier:</tspan> <tspan class="warning">5 synchronized simultaneous requests</tspan></text>
    <text y="220"></text>
    <text y="242"><tspan class="dim">--- Payload Diff ---</tspan></text>
    <text y="264"><tspan class="dim">    "object": {</tspan></text>
    <text y="286"><tspan class="diff-remove">-     "amount_total": 4200,</tspan></text>
    <text y="308"><tspan class="diff-add">+     "amount_total": 999999,</tspan></text>
    <text y="330"><tspan class="dim">      "currency": "usd",</tspan></text>
    <text y="352"><tspan class="diff-remove">-     "payment_status": "paid"</tspan></text>
    <text y="374"><tspan class="diff-add">+     "payment_status": "unpaid"</tspan></text>
    <text y="396"><tspan class="dim">    }</tspan></text>
    <text y="418"><tspan class="dim">--------------------</tspan></text>
    <text y="440"></text>
    <text y="462"><tspan class="success">[1] HTTP 200</tspan><tspan class="dim"> | Latency: 14ms</tspan></text>
    <text y="484"><tspan class="success">[2] HTTP 200</tspan><tspan class="dim"> | Latency: 15ms</tspan></text>
    <text y="506"><tspan class="success">[3] HTTP 200</tspan><tspan class="dim"> | Latency: 14ms</tspan></text>
    <text y="528"><tspan class="success">[4] HTTP 200</tspan><tspan class="dim"> | Latency: 16ms</tspan></text>
    <text y="550"><tspan class="success">[5] HTTP 200</tspan><tspan class="dim"> | Latency: 15ms</tspan></text>
    <text y="572"></text>
    <text y="594"><tspan class="success">Finished: 5/5 successful in 16ms total</tspan></text>
  </g>
</svg>
